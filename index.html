<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab_Web_Cookies</title>
  <!-- В современных браузерах http-equiv="Set-Cookie" не устанавливает cookie. -->
  <style>
    body { font: 18px/1.5 Arial, sans-serif; max-width: 760px; margin: 48px auto; padding: 0 20px; color: #17212b; }
    h1 { font-size: 26px; margin-bottom: 8px; }
    .box { border: 1px solid #b8c5d1; background: #f7fafc; padding: 16px 20px; border-radius: 8px; }
    dt { font-weight: bold; margin-top: 10px; }
    dd { margin-left: 0; overflow-wrap: anywhere; }
    code { font-family: Consolas, monospace; font-size: 17px; }
    small { color: #52606d; }
  </style>
</head>
<body>
  <h1>Проверка сохранения cookie</h1>
  <p>Лабораторная работа «Работа с cookies в браузерах»</p>
  <div class="box">
    <dl>
      <dt>Имя</dt><dd><code>student</code></dd>
      <dt>Значение</dt><dd><code>Nedorostkov</code></dd>
      <dt>Срок хранения</dt><dd id="expires"></dd>
      <dt>Сохранённые cookie страницы</dt><dd><code id="cookies"></code></dd>
    </dl>
  </div>
  <p><small>Cookie создаётся JavaScript и повторно читается после обновления страницы.</small></p>
  <script>
    const expires = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000);
    document.cookie = `student=Nedorostkov; Expires=${expires.toUTCString()}; Path=/; SameSite=Lax`;
    document.getElementById('expires').textContent = expires.toLocaleString('ru-RU');
    document.getElementById('cookies').textContent = document.cookie || 'Cookie не сохранён';
  </script>
</body>
</html>
