<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Проверка ранее сохранённого cookie</title>
  <style>
    body { font: 20px/1.5 Arial, sans-serif; max-width: 760px; margin: 48px auto; padding: 0 20px; color: #17212b; }
    code { display: block; padding: 15px; border: 1px solid #b8c5d1; background: #f7fafc; }
  </style>
</head>
<body>
  <h1>Cookie после перехода на другую страницу</h1>
  <p>Эта страница только читает cookie и не создаёт его повторно.</p>
  <code id="result"></code>
  <script>document.getElementById('result').textContent = document.cookie || 'Cookie не найден';</script>
</body>
</html>
